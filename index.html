<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PNUSear</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="status-band" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">PNUL Seat Time</p>
          <h1 id="page-title">좌석 남은 시간</h1>
        </div>
        <p class="provider-status" id="provider-status">연동 상태 확인 중</p>
      </section>

      <section class="layout">
        <form class="panel settings-panel" id="settings-form">
          <h2>조회 설정</h2>
          <label>
            조회 대상
            <input
              id="rooms"
              name="rooms"
              autocomplete="off"
              value="새벽벌도서관 2층 1열람실, 새벽별당"
            />
          </label>
          <label>
            자동 새로고침
            <select id="refresh-interval" name="refreshInterval">
              <option value="0">끄기</option>
              <option value="5000">5초</option>
              <option value="10000" selected>10초</option>
              <option value="30000">30초</option>
            </select>
          </label>
          <div class="actions">
            <button type="submit">조회</button>
            <button type="button" class="secondary" id="refresh-button">새로고침</button>
          </div>
        </form>

        <form class="panel auth-panel" id="auth-form">
          <h2>로그인 세션</h2>
          <p class="panel-note" id="auth-status">Cookie 헤더 또는 DevTools Headers 내용을 붙여넣고 저장합니다.</p>
          <label>
            Headers
            <textarea
              id="headers-text"
              rows="8"
              spellcheck="false"
              placeholder="cookie&#10;JSESSIONID=...; PUSAN_PYXIS3=...&#10;pyxis-auth-token&#10;..."
            ></textarea>
          </label>
          <div class="actions">
            <button type="submit">세션 저장</button>
          </div>
        </form>

        <section class="panel watch-panel" aria-labelledby="watch-title">
          <div class="watch-header">
            <div>
              <h2 id="watch-title">좌석별 남은 시간</h2>
              <p id="watch-status">좌석 현황을 불러오는 중입니다.</p>
            </div>
            <span class="count-pill" id="seat-count">0개</span>
          </div>
          <div class="seat-list" id="seat-list"></div>
        </section>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
